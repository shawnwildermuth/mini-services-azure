name: End-to-end tests

# Starts the real stack (SQL Server, Redis, Service Bus emulator, the three container images, the Function App) and drives
# it with Playwright in a real browser. Slower than CI, so it runs on pull requests that touch code, nightly, and on demand,
# but it does not gate deployment: deploy.yml runs the faster CI workflow.
on:
  pull_request:
    paths: ['src/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/tests/e2e/package-lock.json

      - name: Start the stack (infrastructure + API + storefront + admin site)
        working-directory: src
        run: docker compose --profile apps up -d --build

      - name: Start the Function App
        working-directory: src/apps/Store.Functions
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          cp local.settings.example.json local.settings.json
          nohup func start > "$RUNNER_TEMP/functions.log" 2>&1 &

      - name: Wait until everything answers
        run: |
          wait_for() { # <name> <url>
            for i in $(seq 1 90); do
              if curl -fsS --max-time 5 "$2" > /dev/null 2>&1; then echo "up: $1"; return 0; fi
              sleep 4
            done
            echo "::error::$1 did not come up ($2)"; docker compose -f src/docker-compose.yml --profile apps logs --tail 80 || true; tail -80 "$RUNNER_TEMP/functions.log" || true; return 1
          }
          wait_for "API"        http://localhost:5233/health/ready
          wait_for "storefront" http://localhost:5173/healthz
          wait_for "admin site" http://localhost:5174/healthz
          wait_for "functions"  http://localhost:7071/

      - name: Install the tests and a browser
        working-directory: src/tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests (desktop and phone)
        working-directory: src/tests/e2e
        env:
          E2E_IMAGES: '1' # the sites under test are the built nginx images
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            src/tests/e2e/playwright-report
            src/tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Function App log (on failure)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/functions.log" || true
